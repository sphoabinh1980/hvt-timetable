databases:
  - name: hvt-timetable-db
    plan: free

services:
  - type: web
    name: hvt-timetable
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_TTL_SECONDS
        value: "604800"
      - key: DATABASE_URL
        fromDatabase:
          name: hvt-timetable-db
          property: connectionString
      - key: DATA_DIR
        value: /app/data
      - key: SCHOOL_NAME
        value: HVT
      - key: TZ
        value: Asia/Ho_Chi_Minh
